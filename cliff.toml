# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body, rendered once per release
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/arias9306/schema-api/compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/arias9306/schema-api/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous and release.previous.version -%}
            [unreleased]: https://github.com/arias9306/schema-api/compare/{{ release.previous.version }}..HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# remove leading and trailing whitespaces from the changelog's body
trim = true

[git]
# parse commits according to the conventional commits specification
conventional_commits = true
# exclude commits that do not match the conventional commits specification
filter_unconventional = false
# strip conventional commit prefixes, e.g. "feat: add foo" -> "add foo"
commit_preprocessors = [
    { pattern = "^(feat|fix|chore|refactor|docs?|perf|style|test|build|ci|revert)(\\([^)]*\\))?: ", replace = "" },
]
# assign commits to groups, first match wins
commit_parsers = [
    { message = "^[a|A]dd", group = "Added" },
    { message = "^[i|I]mplement", group = "Added" },
    { message = "^[i|I]nitial", group = "Added" },
    { message = "^[n|N]ew", group = "Added" },
    { message = "^[c|C]reate", group = "Added" },
    { message = "^[f|F]ix", group = "Fixed" },
    { message = "^[c|C]orrect", group = "Fixed" },
    { message = "^[b|B]ug", group = "Fixed" },
    { message = "^[r|R]emove", group = "Removed" },
    { message = "^[d|D]elete", group = "Removed" },
    { message = "^.*", group = "Changed" },
]
# prevent commits that are breaking from being excluded by commit parsers
protect_breaking_commits = true
# exclude commits that are not matched by any commit parser
filter_commits = false
# order releases topologically instead of chronologically
topo_order = false
# order of commits in each group/release within the changelog
sort_commits = "oldest"
